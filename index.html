<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen</title>
  <meta name="theme-color" content="#2f6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kitchen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Fridge</h1>
    <div class="topbar-actions" id="topActions"></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <button class="fab" id="fab" aria-label="Add">＋</button>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="fridge" class="active"><span>🧊</span>Fridge</button>
    <button data-tab="groceries"><span>🛒</span>Groceries</button>
    <button data-tab="recipes"><span>📖</span>Recipes</button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
